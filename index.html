<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      STARZ AI — You’re Already Paying For The Lead. Stop Losing The Sale.
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient Background & Tech Grid Overlay -->
    <div class="hero-bg-wrapper" aria-hidden="true">
      <div class="hero-single-center-arch"></div>
      <div class="hero-grid-bg"></div>
    </div>

    <!-- Main Content -->
    <main>
      <!-- Section 1: Hero -->
      <section class="hero-section" id="hero">
        <div class="container hero-container">
          <!-- Brand Logo -->
          <div class="hero-brand animate-fade-in">
            <img src="logo.webp" alt="STARZ AI Logo" class="hero-logo-img" />
          </div>

          <!-- Headline -->
          <h1 class="main-headline animate-fade-in delay-1">
            You’re Already Paying For The Lead. Stop Losing
            <span class="doodle-highlight">
              <span class="doodle-text">The Sale.</span>
              <svg
                class="doodle-circle-svg"
                viewBox="0 0 200 60"
                preserveAspectRatio="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M 16 32 C 12 12, 180 6, 190 28 C 198 48, 14 54, 8 32 C 6 22, 35 10, 155 8"
                  fill="none"
                  stroke="#10b981"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </h1>

          <!-- Subheadline -->
          <p class="sub-headline animate-fade-in delay-2">
            Turn every inquiry into a faster conversation, smarter follow-up,
            and more chances every inquiry to close into a faster conversation.
          </p>

          <!-- Primary CTA -->
          <div class="hero-cta-wrapper animate-fade-in delay-3">
            <a href="#" class="btn btn-primary btn-large shadow-glow">
              <span class="btn-text">Book Free 1-on-1 Strategy Call</span>
              <span class="btn-arrow-icon" aria-hidden="true">
                <svg
                  width="10"
                  height="10"
                  viewBox="0 0 10 10"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M3.5 2L6.5 5L3.5 8"
                    stroke="currentColor"
                    stroke-width="1.85"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </a>
          </div>

          <!-- Social Proof Rating & Avatars -->
          <div class="hero-rating-wrapper animate-fade-in delay-3">
            <div class="rating-arrow rating-arrow-left" aria-hidden="true">
              <img src="arrow.svg" alt="" class="rating-doodle-arrow" />
            </div>

            <div class="rating-center">
              <div class="rating-avatars">
                <img
                  src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
                  alt="Customer"
                  class="rating-avatar-img"
                />
                <img
                  src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80"
                  alt="Customer"
                  class="rating-avatar-img"
                />
                <img
                  src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80"
                  alt="Customer"
                  class="rating-avatar-img"
                />
                <img
                  src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80"
                  alt="Customer"
                  class="rating-avatar-img"
                />
              </div>
              <div class="rating-stars-row">
                <div class="rating-stars" aria-label="5 stars">
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                  <i class="fa-solid fa-star"></i>
                </div>
                <span class="rating-text">4.7/5 Rating</span>
              </div>
            </div>

            <div class="rating-arrow rating-arrow-right" aria-hidden="true">
              <img
                src="arrow.svg"
                alt=""
                class="rating-doodle-arrow arrow-flip"
              />
            </div>
          </div>

          <!-- The Video Player -->
          <div class="vsl-container-outer animate-fade-in delay-4">
            <div class="vsl-container">
              <!-- Electric Purple Border Glow Aura -->
              <div class="vsl-border-glow"></div>

              <div class="vsl-player-box" id="vslPlayer">
                <div class="dummy-video-content">
                  <iframe
                    id="vslIframe"
                    data-youtube-url="https://youtu.be/FNgg3V6zI9I?si=ETmupotgaab-KtgU"
                    src="https://www.youtube.com/embed/r2JSYgyOdBs?enablejsapi=1&rel=0"
                    title="STARZ AI VSL Video"
                    allow="
                      accelerometer;
                      autoplay;
                      clipboard-write;
                      encrypted-media;
                      gyroscope;
                      picture-in-picture;
                      web-share;
                    "
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen
                  ></iframe>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
